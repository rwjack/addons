---
version: "1.0.1"
slug: nginx
name: NGINX SSL proxy
description: Dual-hostname TLS reverse proxy for Home Assistant
url: https://github.com/rwjack/addons
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
map:
  - ssl
  - share
options:
  domains:
    - home.example.com
  certfile: fullchain.pem
  keyfile: privkey.pem
  hsts: "max-age=31536000; includeSubDomains"
schema:
  domains:
    - str
  certfile: str
  keyfile: str
  hsts: str
ports:
  443/tcp: 443
  80/tcp: null
